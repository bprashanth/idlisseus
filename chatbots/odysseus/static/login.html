<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">
<title>Idli Insights — Sign in</title>
<link rel="icon" type="image/png" href="/static/icons/raven-favicon.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<!-- Login is deterministic brand chrome: no stored-theme or background-effect bootstrap. -->
<style>
  @font-face { font-family: 'InterVendored'; font-weight: 400; font-style: normal; font-display: swap; src: url('/static/lib/fonts/inter-400.woff2') format('woff2'); }
  @font-face { font-family: 'InterVendored'; font-weight: 500; font-style: normal; font-display: swap; src: url('/static/lib/fonts/inter-500.woff2') format('woff2'); }
  @font-face { font-family: 'InterVendored'; font-weight: 600; font-style: normal; font-display: swap; src: url('/static/lib/fonts/inter-600.woff2') format('woff2'); }
  @font-face { font-family: 'SourceSerifVendored'; font-weight: 300 900; font-style: normal; font-display: swap; src: url('/static/lib/fonts/sourceserif4-var.woff2') format('woff2'); }

  /* Field-journal brand tokens — one deterministic look, matching the app shell
     (static/ecodata.css). dss/DESIGN_SYSTEM.md is the reference. */
  :root {
    --paper: #f7f5f0; --surface: #fffdfa;
    --ink: #1b1a17; --ink-soft: #52514e; --ink-faint: #8a8781;
    --line: #e7e3da; --line-strong: #d9d4c8;
    --pine: #1d5c45; --pine-deep: #144533;
    --font-ui: 'InterVendored', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-display: 'SourceSerifVendored', 'Iowan Old Style', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--paper); color: var(--ink);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; min-height: 100dvh;
    padding-top: 15vh;
    transition: padding-top 0.2s ease;
    -webkit-font-smoothing: antialiased;
  }
  /* Faint contour lines low on the page — the field, quietly. */
  body::after {
    content: ''; position: fixed; left: 0; right: 0; bottom: -12vh; height: 44vh;
    pointer-events: none; z-index: 0;
    background:
      radial-gradient(120vw 42vh at 50% 118%, transparent 64%, rgba(29,92,69,0.10) 64.4%, rgba(29,92,69,0.10) 64.8%, transparent 65.2%),
      radial-gradient(110vw 38vh at 42% 120%, transparent 62%, rgba(29,92,69,0.08) 62.4%, rgba(29,92,69,0.08) 62.8%, transparent 63.2%),
      radial-gradient(130vw 46vh at 58% 122%, transparent 66%, rgba(29,92,69,0.06) 66.4%, rgba(29,92,69,0.06) 66.8%, transparent 67.2%);
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 1px 2px rgba(27,26,23,0.05), 0 12px 40px rgba(27,26,23,0.06);
    padding: 2.2rem 2rem 2rem; width: 380px; max-width: 92vw;
    position: relative; z-index: 1;
  }
  .logo { text-align: center; margin-bottom: 0.5rem; }
  .logo span {
    font-family: var(--font-display);
    font-size: 2.1rem; font-weight: 600; letter-spacing: -0.01em;
    color: var(--ink);
  }
  .login-sub {
    text-align: center; color: var(--ink-soft); font-size: 0.85rem;
    margin-bottom: 1.6rem; line-height: 1.5;
  }
  .setup-note { color: var(--ink-soft); font-size: 0.8rem; margin-bottom: 1rem; text-align: center; }
  label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 0.35rem; color: var(--ink-soft); }
  input:not(.remember-check) {
    width: 100%; padding: 0.65rem 0.85rem; margin-bottom: 1rem;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px;
    color: var(--ink); font-size: 0.95rem; font-family: var(--font-ui);
  }
  input:focus { outline: none; border-color: var(--pine); }
  @media (hover: none) and (pointer: coarse) {
    input:not(.remember-check) { font-size: 16px !important; }
  }
  input:focus-visible, a:focus-visible, button:focus-visible {
    outline: 2px solid var(--pine);
    outline-offset: 2px;
  }
  button {
    width: 100%;
    padding: calc(0.7rem + 1px) 0.7rem calc(0.7rem - 1px);
    border: none; border-radius: 10px;
    background: var(--pine); color: #fff; font-size: 0.95rem; cursor: pointer;
    font-weight: 600; font-family: var(--font-ui);
    transition: background 140ms ease;
  }
  button:hover { background: var(--pine-deep); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: #b3261e; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
  .toggle { text-align: center; margin-top: calc(1rem + 4px); font-size: 0.85rem; color: var(--ink-faint); }
  .toggle a { color: var(--pine); cursor: pointer; text-decoration: none; font-weight: 500; }
  .toggle a:hover { text-decoration: underline; }
  .pw-wrapper { position: relative; margin-bottom: 1rem; }
  .pw-wrapper input:not(.remember-check) { padding-right: 2.5rem; margin-bottom: 0; }
  .pw-toggle {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(calc(-50% + 1px));
    background: none; border: none; padding: 4px; cursor: pointer;
    color: var(--ink-faint); width: auto;
    display: flex; align-items: center; justify-content: center;
  }
  .pw-toggle:hover { color: var(--ink); background: none; }
  .pw-toggle svg { display: block; }
  .remember-toggle {
    position: absolute !important; right: 13px; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 2px; cursor: pointer;
    width: 14px !important; height: 14px !important; display: flex !important;
    align-items: center; justify-content: center;
    font-size: 0; margin: 0; color: transparent;
  }
  .remember-toggle .remember-check {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; margin: 0;
    opacity: 0; cursor: pointer;
  }
  .remember-toggle .remember-check:focus-visible + .remember-dot {
    outline: 2px solid var(--pine); outline-offset: 2px;
  }
  .remember-toggle .remember-dot {
    display: block; width: 10px; height: 10px; min-width: 10px; min-height: 10px;
    border-radius: 50%;
    border: 2px solid var(--line-strong);
    background: transparent;
    transition: all 0.15s;
  }
  .remember-toggle .remember-check:checked + .remember-dot {
    border-color: transparent;
    background: var(--pine);
  }
  .remember-toggle:hover .remember-dot { border-color: var(--ink-faint); }
  .logo-mark {
    display: inline-block; width: 2rem; height: 2rem;
    margin-right: 0.5rem; vertical-align: -0.35em;
    background: var(--ink);
    -webkit-mask: url('/static/icons/raven.png') center / contain no-repeat;
    mask: url('/static/icons/raven.png') center / contain no-repeat;
  }
  .version-label {
    position: fixed; bottom: 12px; right: 16px;
    font-size: 0.7rem; opacity: 0.35; color: var(--ink-faint);
    pointer-events: none; user-select: none;
  }
  .login-spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: login-spin 0.7s linear infinite;
    vertical-align: -3px;
  }
  @keyframes login-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main class="card">
  <h1 class="logo">
    <span class="logo-mark" aria-hidden="true"></span><span>Idli Insights</span>
  </h1>
  <p class="login-sub">Explore your data visually, in plain conversation.</p>
  <p class="setup-note" id="setupNote" style="display:none"></p>

  <div class="error" id="error" role="alert" aria-live="assertive"></div>

  <form id="authForm" autocomplete="on">
    <label for="username">Username</label>
    <div class="pw-wrapper">
      <input id="username" name="username" type="text" required autofocus autocomplete="username">
      <label class="remember-toggle" id="rememberToggle" title="Remember me">
        <input type="checkbox" class="remember-check" id="remember" checked aria-label="Remember me">
        <span class="remember-dot" aria-hidden="true"></span>
      </label>
    </div>

    <label for="password">Password</label>
    <div class="pw-wrapper">
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pwToggle" tabindex="-1" aria-label="Show password">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>
      </button>
    </div>

    <div id="confirmGroup" style="display:none">
      <label for="confirmPassword">Confirm Password</label>
      <div class="pw-wrapper">
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password">
        <button type="button" class="pw-toggle" id="pwToggleConfirm" tabindex="-1" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" id="submitBtn">Sign In</button>
  </form>

  <div class="toggle" id="toggleArea" style="display:none">
    <span id="toggleText">Don't have an account? </span>
    <a id="toggleLink" href="#">Sign up</a>
  </div>
</main>

<footer class="version-label" id="version-label"></footer>

<script nonce="{{CSP_NONCE}}">
(async () => {
  // Load version
  try {
    const vr = await fetch('/api/version');
    if (vr.ok) {
      const vd = await vr.json();
      document.getElementById('version-label').textContent = 'v' + vd.version;
    }
  } catch(e) {}

  // Prefill last username
  const usernameInput = document.getElementById('username');
  const savedUser = localStorage.getItem('idlisseus-last-user');
  if (savedUser && usernameInput) {
    usernameInput.value = savedUser;
    document.getElementById('password').focus();
  }

  const form = document.getElementById('authForm');
  const errEl = document.getElementById('error');
  const setupNote = document.getElementById('setupNote');
  const confirmGroup = document.getElementById('confirmGroup');
  const submitBtn = document.getElementById('submitBtn');
  const toggleArea = document.getElementById('toggleArea');
  const toggleLink = document.getElementById('toggleLink');
  const toggleText = document.getElementById('toggleText');

  let mode = 'login'; // 'login' | 'signup' | 'setup'
  let signupAllowed = false;
  let policy = { password_min_length: 8, reserved_usernames: [] };

  const rememberToggle = document.getElementById('rememberToggle');

  function setMode(m) {
    mode = m;
    errEl.style.display = 'none';
    if (m === 'setup') {
      setupNote.textContent = 'First-time setup — create your admin account';
      setupNote.style.display = 'block';
      confirmGroup.style.display = 'block';
      submitBtn.textContent = 'Create Admin Account';
      toggleArea.style.display = 'none';
      rememberToggle.style.display = 'none';
    } else if (m === 'signup') {
      setupNote.style.display = 'none';
      confirmGroup.style.display = 'block';
      submitBtn.innerHTML = '<span style="position:relative;top:1px;">Create Account</span>';
      toggleArea.style.display = 'block';
      toggleText.textContent = 'Already have an account? ';
      toggleLink.textContent = 'Sign in';
      rememberToggle.style.display = 'none';
    } else {
      setupNote.style.display = 'none';
      confirmGroup.style.display = 'none';
      submitBtn.textContent = 'Sign In';
      toggleArea.style.display = signupAllowed ? 'block' : 'none';
      toggleText.textContent = "Don't have an account? ";
      toggleLink.textContent = 'Sign up';
      rememberToggle.style.display = '';
    }
  }

  // Check auth status and fetch policy in parallel, but don't block the
  // authenticated redirect on the policy response.
  const policyPromise = fetch('/api/auth/policy', { credentials: 'same-origin' }).catch(() => null);
  try {
    const statusRes = await fetch('/api/auth/status', { credentials: 'same-origin' });
    const data = await statusRes.json();
    if (data.authenticated) {
      window.location.replace('/');
      return;
    }
    signupAllowed = !!data.signup_enabled;
    if (!data.configured) {
      setMode('setup');
    } else {
      setMode('login');
    }
    const policyRes = await policyPromise;
    if (policyRes && policyRes.ok) {
      policy = await policyRes.json();
    }
  } catch (e) {
    setMode('login');
  }

  toggleLink.addEventListener('click', (e) => {
    e.preventDefault();
    setMode(mode === 'login' ? 'signup' : 'login');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.style.display = 'none';
    submitBtn.disabled = true;

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    // If in TOTP mode, handle the code submission directly
    if (form._totpMode) {
      const totpInput = document.getElementById('totp-input');
      const code = totpInput ? totpInput.value.trim() : '';
      if (!code) { totpInput.focus(); submitBtn.disabled = false; return; }
      const remember = document.getElementById('remember').checked;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password, remember, totp_code: code })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Invalid code');
        if (!data.ok) throw new Error('Login failed');
        form._totpMode = false;
        finishLogin();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        submitBtn.disabled = false;
      }
      return;
    }

    // Validate confirm password for setup/signup
    if (mode === 'setup' || mode === 'signup') {
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match';
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
      if (password.length < policy.password_min_length) {
        errEl.textContent = `Password must be at least ${policy.password_min_length} characters`;
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
      if (policy.reserved_usernames.includes(username.toLowerCase())) {
        errEl.textContent = 'This username is reserved';
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
    }

    // Setup or signup first
    if (mode === 'setup' || mode === 'signup') {
      const endpoint = mode === 'setup' ? '/api/auth/setup' : '/api/auth/signup';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Account creation failed');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
    }

    // Login (auto-login after setup/signup too)
    const remember = document.getElementById('remember').checked;
    function finishLogin() {
      const _rem = document.getElementById('remember').checked;
      if (_rem) localStorage.setItem('idlisseus-last-user', username);
      else localStorage.removeItem('idlisseus-last-user');
      sessionStorage.removeItem('ody-session-active');
      submitBtn.innerHTML = '<span class="login-spinner" aria-hidden="true"></span>';
      submitBtn.disabled = true;
      Promise.all([
        fetch('/api/sessions', { credentials: 'same-origin' }).then(r => r.json()),
        fetch('/api/auth/features', { credentials: 'same-origin' }).then(r => r.json()),
        fetch('/api/auth/settings', { credentials: 'same-origin' }).then(r => r.json()),
      ]).then(([sess, feat, sett]) => {
        sessionStorage.setItem('ody-prefetch-sessions', JSON.stringify(sess));
        sessionStorage.setItem('ody-prefetch-features', JSON.stringify(feat));
        sessionStorage.setItem('ody-prefetch-settings', JSON.stringify(sett));
      }).catch(() => {}).finally(() => { window.location.replace('/'); });
    }
    async function doLogin(totpCode) {
      const loginBody = { username, password, remember };
      if (totpCode) loginBody.totp_code = totpCode;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(loginBody)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed');
      return data;
    }
    try {
      let data = await doLogin();
      // 2FA required — show TOTP input
      if (data.requires_totp) {
        submitBtn.disabled = false;
        // Only add TOTP input once
        if (document.getElementById('totp-input')) return;
        form._totpMode = true;
        const totpWrap = document.createElement('div');
        totpWrap.style.cssText = 'margin-top:12px;';
        totpWrap.innerHTML = '<label for="totp-input" style="font-size:0.85em;opacity:0.7;display:block;margin-bottom:4px;">2FA Code</label><input type="text" id="totp-input" placeholder="Enter 6-digit code" aria-label="Two-factor authentication code" autocomplete="one-time-code" inputmode="numeric" maxlength="8" style="width:100%;padding:10px 12px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;font-size:14px;box-sizing:border-box;text-align:center;letter-spacing:4px;">';
        const formEl = submitBtn.parentElement;
        formEl.insertBefore(totpWrap, submitBtn);
        const totpInput = document.getElementById('totp-input');
        totpInput.focus();
        submitBtn.textContent = 'Verify';
        return;
      }
      finishLogin();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      return;
    }
  });

  // Password show/hide toggles
  const eyeOpen = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeClosed = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>';

  function wireToggle(btnId, inputId) {
    const btn = document.getElementById(btnId);
    const inp = document.getElementById(inputId);
    if (!btn || !inp) return;
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = show ? eyeOpen : eyeClosed;
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      inp.focus();
    });
  }
  wireToggle('pwToggle', 'password');
  wireToggle('pwToggleConfirm', 'confirmPassword');
})();

// Prevent login button and eye toggles from stealing focus on mobile (keeps keyboard open)
document.querySelectorAll('#submitBtn, .pw-toggle').forEach(btn => {
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
  btn.addEventListener('touchend', (e) => {
    e.preventDefault();
    btn.click();
  });
});

// Mobile keyboard: shift card up when virtual keyboard opens
if (window.visualViewport) {
  const card = document.querySelector('.card');
  window.visualViewport.addEventListener('resize', () => {
    const vvh = window.visualViewport.height;
    const wh = window.innerHeight;
    if (vvh < wh * 0.8) {
      document.body.style.paddingTop = '5vh';
      // Keep the active input visible without jumping the whole card to the top
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        document.activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } else {
      document.body.style.paddingTop = '';
    }
  });
}
</script>

</body>
</html>
